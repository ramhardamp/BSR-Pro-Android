name: BSR Pro Android Final Build
on: [push, workflow_dispatch]
permissions:
  contents: write
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Download Android source
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o source.zip https://github.com/ramhardamp/BABASITARAM/archive/refs/heads/main.zip
          unzip -q source.zip
          rm source.zip
          rm -rf android
          mkdir android
          cp -R BABASITARAM-main/apk/. android/
          rm -rf BABASITARAM-main
      - name: Configure Android project
        shell: bash
        run: |
          set -euo pipefail
          test -f android/gradlew
          sed -i 's/compileSdk 34/compileSdk 36/g; s/targetSdk 34/targetSdk 36/g; s/versionCode 3/versionCode 54100/g; s/versionName "3.2"/versionName "5.41.0"/g' android/app/build.gradle || true
          python3 - <<'PY'
from pathlib import Path
p=Path("android/app/src/main/AndroidManifest.xml")
if p.exists():
    s=p.read_text()
    service='''        <service
            android:name=".BsrAutofillService"
            android:permission="android.permission.BIND_AUTOFILL_SERVICE"
            android:exported="true">
            <intent-filter>
                <action android:name="android.service.autofill.AutofillService" />
            </intent-filter>
            <meta-data
                android:name="android.autofill"
                android:resource="@xml/autofill_service" />
        </service>

'''
    if 'android:name=".BsrAutofillService"' not in s and 'android.service.autofill.AutofillService' in s or ('BsrAutofillService.java' in '\n'.join(str(x) for x in Path("android/app/src/main").rglob("*"))):
        s=s.replace('        <activity',service+'        <activity',1)
        p.write_text(s)
d=Path("android/app/src/main/res/xml")
d.mkdir(parents=True,exist_ok=True)
if not (d/"autofill_service.xml").exists():
    (d/"autofill_service.xml").write_text('''<?xml version="1.0" encoding="utf-8"?>
<autofill-service xmlns:android="http://schemas.android.com/apk/res/android"
    android:settingsActivity="com.babasitaram.pro.MainActivity" />
''')
PY
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean assembleDebug
      - name: Package ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p package/BSR-Pro-Android/apk package/BSR-Pro-Android
          cp -R android package/BSR-Pro-Android/android
          cp android/app/build/outputs/apk/debug/app-debug.apk package/BSR-Pro-Android/apk/BSR-Pro-Android-5.41.0-debug.apk
          printf '%s\n' '# BSR-Pro-Android 5.41.0' '' 'Android source + debug APK package.' > package/BSR-Pro-Android/BUILD_INFO.md
          (cd package && zip -qr ../BSR-Pro-Android-FINAL-5.41.0.zip BSR-Pro-Android)
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BSR-Pro-Android-FINAL-5.41.0
          path: |
            BSR-Pro-Android-FINAL-5.41.0.zip
            android/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload ZIP and APK to repository
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p releases
          cp BSR-Pro-Android-FINAL-5.41.0.zip releases/
          cp android/app/build/outputs/apk/debug/app-debug.apk releases/BSR-Pro-Android-5.41.0-debug.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases/
          git commit -m "build: BSR Pro Android 5.41.0 package" || true
          git push
